/* ---------- Tokens (contrast is on --void) ---------- */
:root {
  color-scheme: dark;
  --void: #07070a;                          /* page, canvas clear, theme-color */
  --paper: #f2f6ff;                         /* 18.59:1 headlines, titles, primary fill */
  --paper-soft: #a8b4c8;                    /*  9.61:1 body, lede, ok status; dimmest text over a canvas */
  --paper-mute: #737f93;                    /*  4.97:1 meta, eyebrows, index, placeholder, dates in tools */
  --glow: #cfe2ff;                          /* 15.31:1 THE accent: live, hover, focus, selected, wordmark period */
  --fail: #f0b8b0;                          /* 11.68:1 act now */
  --warn: #dbc895;                          /* 12.17:1 act soon */
  --hair: rgba(180, 200, 230, .14);         /*  1.26:1 decorative rules only */
  --line: rgba(180, 200, 230, .28);         /*  1.84:1 table header rule, blockquote rule (decorative) */
  --line-control: #5d6878;                  /*  3.56:1 input and ghost-button borders */
  --line-focus: rgba(207, 226, 255, .55);   /*  5.00:1 focused input border */
  --tint-focus: rgba(255, 255, 255, .04);   /* focused input fill; placeholder stays 4.65:1 */
  --selection: rgba(190, 215, 255, .24);

  --pixel: "Geist Pixel Circle", "JetBrains Mono", ui-monospace, monospace;    /* 20px and up only */
  --pixel-sm: "Geist Pixel Square", "JetBrains Mono", ui-monospace, monospace; /* 11 to 19px */
  --sans: "Inter", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --max: 1200px;
  --gutter: clamp(28px, 12vw, 210px);       /* landing and reading: the zoomed-out look */
}
@media (max-width: 860px) { :root { --gutter: clamp(20px, 6vw, 32px); } }
.tool { --gutter: clamp(16px, 4vw, 48px); }  /* dashboards spend width on data */

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); font-synthesis: none; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--void); color: var(--paper-soft);
  font: 400 .85rem/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
.tool { font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4, h5, h6, p, ul, ol, figure, blockquote { margin: 0; }
p { text-wrap: pretty; }
em, i, cite { font-style: normal; color: var(--paper); }      /* no italic face is loaded */
strong, b { font-weight: 600; color: var(--paper); }
code, kbd, samp, pre { font-family: var(--mono); font-variant-ligatures: none; }
.num, .tabular { font-variant-numeric: tabular-nums; }
a { color: var(--paper); text-decoration: underline 1px var(--paper-mute); text-underline-offset: 3px; }
a:hover { color: var(--glow); text-decoration-color: var(--glow); }
hr { border: 0; border-top: 1px solid var(--hair); margin: 0; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }   /* never a radius */
::selection { background: var(--selection); color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ---------- Type roles ---------- */
.display-1, .display-2, .verdict, .numeral, .prose h1 {
  font-family: var(--pixel); font-weight: 400; letter-spacing: .01em; color: var(--paper); text-wrap: balance; hyphens: none; }
.display-1 { font-size: clamp(1.5rem, 3.4vw, 2.6rem); line-height: 1.1; max-width: 14em; }
.display-2 { font-size: clamp(1.25rem, 2.4vw, 1.9rem); line-height: 1.15; max-width: 18em; }
.numeral { font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; letter-spacing: 0; }
.px { font-family: var(--pixel-sm); font-weight: 400; letter-spacing: .04em; }    /* 11 to 19px labels */
.wordmark { font: 400 14px/1 var(--pixel-sm); letter-spacing: .02em; color: var(--paper); text-decoration: none; }
.wordmark i { color: var(--glow); }
.lede { font-size: clamp(.82rem, 1vw, .92rem); line-height: 1.62; color: var(--paper-soft); max-width: 32em; }
.title { font: 600 1rem/1.3 var(--sans); letter-spacing: -.02em; color: var(--paper); }
.eyebrow { font: 500 11px/16px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--paper-mute); }
.index { font: 400 11px/16px var(--mono); letter-spacing: .2em; color: var(--paper-mute); }
.meta { font: 400 11px/16px var(--mono); letter-spacing: .04em; color: var(--paper-mute); }

/* ---------- Controls: hard corners, 44px, on void ---------- */
input, button, select, textarea { font: inherit; color: inherit; border-radius: 0; }
.label { display: block; margin-bottom: 8px; font: 500 11px/16px var(--mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--paper-mute); }
.field { min-height: 44px; padding: 11px 13px; font: 400 12px/1.6 var(--mono); letter-spacing: .02em;
  color: var(--paper); background: transparent; border: 1px solid var(--line-control); outline: none;
  transition: border-color .18s ease, background-color .18s ease; }
.field::placeholder { color: var(--paper-mute); opacity: 1; }
.field:focus-visible { border-color: var(--line-focus); background: var(--tint-focus); outline: 2px solid var(--glow); outline-offset: 3px; }
.field-error { margin-top: 8px; font: 400 13px/1.5 var(--sans); color: var(--fail); }
.btn { min-height: 44px; padding: 0 20px; font: 400 12px/1 var(--pixel-sm); letter-spacing: .12em;
  text-transform: uppercase; color: var(--void); background: var(--paper); border: 1px solid var(--paper);
  cursor: pointer; transition: background-color .18s ease, color .18s ease; }
.btn:hover:not(:disabled) { background: transparent; color: var(--paper); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn--ghost { color: var(--paper); background: transparent; border-color: var(--line-control); }
.btn--ghost:hover:not(:disabled) { border-color: var(--paper); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row .field { flex: 1 1 12rem; min-width: 0; }
@media (max-width: 860px), (pointer: coarse) { .field { font-size: 16px; } }   /* iOS zooms below 16px */
@media (max-width: 860px) { .row .field, .row .btn { flex: 1 1 100%; } }

/* ---------- Page frame ---------- */
.page { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter) 64px; }
.page.flush { padding-bottom: 0; }
.section { padding: clamp(64px, 8vw, 104px) 0; border-top: 1px solid var(--hair); }
.measure { max-width: 32em; }   /* about 66 characters of Inter; left-aligned, never centred */
.measure > p + p { margin-top: 18px; }

/* ---------- Landing hero (somach.life) ---------- */
.signal-hero { position: relative; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
.signal-field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; display: block;
  /* The scrim as a mask on the dots, not a void layer over void (that layer bands). */
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.04) 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.8) 48%, #000 58%),
                      linear-gradient(100deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.7) 34%, #000 60%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to top, rgba(0,0,0,.04) 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.8) 48%, #000 58%),
              linear-gradient(100deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.7) 34%, #000 60%);
  mask-composite: intersect; }
.signal-mast { position: relative; z-index: 2; width: 100%; max-width: var(--max); margin: 0 auto;
  padding: clamp(24px, 4vw, 44px) var(--gutter) 0; display: flex; align-items: baseline; gap: 18px; }
.signal-hero-inner { position: relative; z-index: 2; width: 100%; max-width: var(--max);
  margin: auto auto 0; padding: 0 var(--gutter) clamp(40px, 6vw, 72px); }
.signal-hero-copy { max-width: 26rem; }
.signal-hero-copy .lede { margin-top: 16px; }
.signal-hero-copy .row { margin-top: 28px; }
@media (max-width: 860px) {
  .signal-hero { min-height: auto; }
  .signal-field { position: relative; height: 46svh; min-height: 260px; max-height: 420px;
    -webkit-mask-image: none; mask-image: none; }
  .signal-hero-inner { margin-top: 0; padding-top: clamp(18px, 4vw, 28px); padding-bottom: clamp(48px, 9vw, 72px); }
  .signal-hero-copy { max-width: none; }
}

/* Status trace: the live rule. The block is the pointer target, not the canvas. */
.trace { margin-top: 14px; padding: 10px 0; cursor: crosshair; }
.trace canvas { display: block; width: 100%; height: 56px; }
.trace--busy canvas { height: 24px; }

/* Ordered process, 2 to 4 steps only (Intent, Signal, Text). Parallel items are rows. */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: clamp(28px, 4vw, 56px);
  list-style: none; padding: 0; }
.steps .title { margin-top: 14px; }
.steps p { margin-top: 10px; font-size: .82rem; line-height: 1.65; }

/* Dated list (the build log idiom; phone-first pages use it instead of a table). */
.log-list { list-style: none; padding: 0; }
.log-item { border-bottom: 1px solid var(--hair); }
.log-item:last-child { border-bottom: 0; }
.log-row { display: flex; align-items: baseline; gap: 16px; width: 100%; padding: 13px 0; background: none;
  border: 0; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.log-date { flex-shrink: 0; min-width: 88px; font: 400 11.5px/1.6 var(--pixel-sm); letter-spacing: .04em; color: var(--paper-soft); }
.log-title { font-size: .84rem; color: var(--paper); transition: color .15s ease; }
button.log-row:hover .log-title, button.log-row:focus-visible .log-title { color: var(--glow); }
.log-toggle { margin-left: auto; font-family: var(--mono); color: var(--paper-mute); }
.log-detail { padding: 0 0 17px calc(88px + 16px); max-width: 36rem; font-size: .8rem; line-height: 1.65; }
.log-year { margin-top: 30px; font: 400 11px/1.6 var(--pixel-sm); letter-spacing: .16em; color: var(--paper-soft); }
@media (max-width: 640px) {
  .log-row { display: block; position: relative; padding-right: 28px; }
  .log-date { display: block; margin-bottom: 3px; }
  .log-toggle { position: absolute; right: 0; top: 12px; }
  .log-detail { padding-left: 0; }
}

/* NOW line. The live dot pulses twice (4.8 s), then holds: WCAG 2.2.2. */
.now { display: flex; align-items: baseline; gap: 12px; margin-top: 24px; }
.now-label { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; font: 400 11px/1 var(--pixel-sm);
  letter-spacing: .08em; text-transform: uppercase; color: var(--glow); }
.now-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--glow);
  box-shadow: 0 0 10px var(--glow); animation: pulse 2.4s ease-in-out 2; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- Tools: mast, verdict, readouts, regions ---------- */
.mast { display: flex; align-items: baseline; gap: 16px; padding: 24px 0 32px; }
.mast .meta { margin-left: auto; }
.verdict { margin: 0; font-size: clamp(1.25rem, 2.4vw, 1.9rem); line-height: 1.15; max-width: 24em; }
.verdict.fail { color: var(--fail); }
.verdict + .meta { margin-top: 8px; }
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); column-gap: 24px; margin: 32px 0; }
.readout { border-top: 1px solid var(--hair); padding-top: 16px; }
.readout b { display: block; font: 400 28px/1 var(--pixel); color: var(--paper); }
.readout b.live { font-family: var(--mono); font-weight: 400; }   /* numbers that update live use Mono */
.readout span { display: block; margin-top: 8px; font: 500 11px/16px var(--mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--paper-mute); }
.region { border-top: 1px solid var(--hair); padding: 24px 0 32px; }
.region.fail { border-top-color: var(--fail); }
.region-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; font: 500 11px/16px var(--mono);
  letter-spacing: .2em; text-transform: uppercase; color: var(--paper-mute); }
.region-head .st { margin-left: auto; }
.empty { margin: 0; padding: 16px 0; font: 400 13px/1.5 var(--sans); color: var(--paper-mute); }
.empty.err { color: var(--fail); }

/* ---------- Status: a dot plus a word, always both ----------
   filled = the signal arrived; ring = an expected signal is missing.
   Warm means act (fail now, warn soon). Cool means fine. */
.st { white-space: nowrap; font: 500 11px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.st::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%;
  background: currentColor; vertical-align: 1px; }
.st.ok { color: var(--paper-soft); }
.st.fail, .st.stale { color: var(--fail); }
.st.warn, .st.deferred { color: var(--warn); }
.st.running { color: var(--glow); }
.st.off { color: var(--paper-mute); }
.st:is(.stale, .deferred, .off)::before { background: none; border: 1.5px solid currentColor; }
.st.running::before { box-shadow: 0 0 10px var(--glow); animation: pulse 2.4s ease-in-out 2; }

/* ---------- Tables ---------- */
.tbl-wrap { margin: 0 -6px; padding: 0 6px; }   /* room for focus rings */
.tbl { width: 100%; border-collapse: collapse; font: 400 13px/20px var(--sans); }
.tbl th { position: sticky; top: 0; z-index: 1; background: var(--void); padding: 0 12px 8px; text-align: left;
  vertical-align: bottom; white-space: nowrap; border-bottom: 1px solid var(--line);
  font: 500 11px/16px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--hair); vertical-align: baseline; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl :is(th, td):first-child { padding-left: 0; }
.tbl :is(th, td):last-child { padding-right: 0; }
.tbl td.t { color: var(--paper); }
.tbl td.t a { color: inherit; text-decoration: none; }
.tbl td.t a:hover { color: var(--glow); }
.tbl :is(td.id, td.num, td.date) { font: 400 12px/20px var(--mono); white-space: nowrap; }
.tbl td.date { color: var(--paper-mute); }
.tbl .num { text-align: right; }
.tbl td.sum { max-width: 48ch; }
@media (max-width: 860px) { .tbl-wrap { overflow-x: auto; } .tbl .p3 { display: none; } }
@media (max-width: 640px) { .tbl .p2 { display: none; } }
@media (pointer: coarse) { .tbl td { padding-block: 12px; } }

/* Dot-series charts (SomachSignal.drawDotSeries); size the canvas, the script fills it. */
.spark { display: inline-block; width: 96px; height: 20px; vertical-align: -4px; }
.chart { display: block; width: 100%; height: 120px; }

/* ---------- Reading (mdview, generated records) ---------- */
.prose { max-width: 32em; font: 400 16px/1.65 var(--sans); color: var(--paper-soft); }
.prose > * + * { margin-top: 16px; }
.prose h1 { font-size: 32px; line-height: 1.15; margin-bottom: 8px; }
.prose h1.long { font: 600 28px/1.2 var(--sans); letter-spacing: -.01em; }   /* titles over 40 characters */
.prose h2 { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--hair);
  font: 600 20px/1.3 var(--sans); letter-spacing: -.01em; color: var(--paper); }
.prose h3 { margin-top: 32px; font: 600 16px/1.35 var(--sans); color: var(--paper); }
.prose :is(h4, h5, h6) { margin-top: 24px; font: 500 11px/16px var(--mono); letter-spacing: .2em;
  text-transform: uppercase; color: var(--paper-mute); }
.prose :is(ul, ol) { padding-left: 24px; }
.prose li + li { margin-top: 4px; }
.prose li::marker { color: var(--paper-mute); }
.prose ol > li::marker { font: 400 12px var(--mono); }
.prose blockquote { padding-left: 16px; border-left: 1px solid var(--line); }
.prose :not(pre) > code { padding: 1px 4px; font-size: .875em; color: var(--paper); background: rgba(180, 200, 230, .07); }
.prose pre { padding: 16px 0; overflow-x: auto; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
  font: 400 13px/20px var(--mono); color: var(--paper); }
.prose table { width: 100%; border-collapse: collapse; font-size: 14px; }
.prose th { padding: 0 12px 8px 0; text-align: left; border-bottom: 1px solid var(--line);
  font: 500 11px/16px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); }
.prose td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hair); }
.prose img { max-width: 100%; height: auto; }
.prose .src { font: 400 11px/16px var(--mono); color: var(--paper-mute); word-break: break-all; }

/* ---------- Motion and failure ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
/* Silence is the bug: kit.py's font check sets this attribute when a face fails to load. */
html[data-fonts-missing]::before { content: "FONTS MISSING: " attr(data-fonts-missing); position: fixed; inset: 0 0 auto;
  z-index: 2147483647; padding: 6px 12px; font: 12px/1.4 ui-monospace, monospace; color: var(--void); background: var(--fail); }

</style>
<style>

<body>
<div id="stage">
  <div id="beats"></div>
  <div id="hud"></div>
  <div id="bar"></div>
  <div id="drawer"></div>
</div>
<script>
/* signal.js: the somach signal material for any page, no dependencies.
 *
 * Port of SignalField.tsx and StatusTrace.tsx from the somach.life repo
 * (/Users/carl/Downloads/carl/md-somach-inc/website/components/signal/, commit bd3e145).
 * The drawing math is copied expression for expression, so a frame drawn here is
 * pixel-identical to the live site; `node verify.mjs` checks exactly that.
 * Behaviour follows /Users/carl/Downloads/carl/DESIGN_SYSTEM.md section 6: settle after
 * 5 s without input, pause offscreen and in background tabs, 60 fps cap, touch pluck,
 * one static frame under prefers-reduced-motion.
 *
 * Classic script, defines window.SomachSignal. In a standalone file inline it in a
 * <script> (kit.py inline does that); in a served app load it same-origin.
 *
 *   SomachSignal.mountSignalField(canvas, opts) -> { destroy, pause, resume, surge(on) }
 *   SomachSignal.mountStatusTrace(canvas, opts) -> { destroy, pause, resume, burst(power, u) }
 *   SomachSignal.drawSignalFrame(canvas, { t: 6.2 })   static strand (OG images, PDFs, slides)
 *   SomachSignal.drawTraceFrame(canvas, { t: 3.1 })    static trace
 *   SomachSignal.drawDotSeries(canvas, values, opts)    a page's own data in the dot material
 */
(function (root) {
  "use strict";

  const { sin, cos, min, max, floor, round, abs, random, exp } = Math;
  const VOID = "#07070a";

  // ---------------------------------------------------------------- the strand

  const VW = 1400;
  const VH = 440;
  const X_LEAD = 0.07 * VW;
  const X_SPAN = 0.84 * VW;
  // Bands split the point INDEX range (not u): stop = floor(end * count).
  const BANDS = [
    { end: 0.34, fill: "rgba(126,158,204,0.34)" },
    { end: 0.64, fill: "rgba(174,204,240,0.40)" },
    { end: 0.85, fill: "rgba(220,236,255,0.46)" },
    { end: 1.0, fill: "rgba(246,250,255,0.55)" },
  ];

  const FIELD_DEFAULTS = {
    interactionEl: undefined, // default canvas.parentElement
    surgeEl: undefined, // default interactionEl.querySelector(".signal-title")
    orientation: "auto", // "auto" | "landscape" | "vertical"
    verticalQuery: "(max-width: 860px)",
    opaque: false, // true = clear to void (live site, with the overlay scrim); false = transparent, use the CSS mask
    t0: 0.6,
    tStatic: 6.2,
    maxPoints: 30000,
    minPoints: 11000,
    dprCap: 2,
    maxFps: 60,
    idleStopMs: 5000, // 0 = never settle (breaks WCAG 2.2.2 unless the page has a pause control)
    pauseOffscreen: true,
  };

  function smoothstep(x) {
    const v = min(1, max(0, x));
    return v * v * (3 - 2 * v);
  }

  function gauss(x, sigma) {
    return exp(-(x * x) / (2 * sigma * sigma));
  }

  function dprOf(cap) {
    return min(root.devicePixelRatio || 1, cap);
  }

  function decorate(canvas) {
    if (!canvas.hasAttribute("role") && !canvas.hasAttribute("aria-label")) {
      canvas.setAttribute("aria-hidden", "true");
      canvas.setAttribute("role", "presentation");
    }
  }

  function fieldGeometry(canvas, o) {
    const dpr = dprOf(o.dprCap);
    const rect = canvas.getBoundingClientRect();
    const width = max(1, floor(rect.width * dpr));
    const height = max(1, floor(rect.height * dpr));
    // Assigning canvas.width clears the bitmap even when unchanged.
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    const dot = max(1, round(dpr));
    const rotated =
      o.orientation === "vertical" ? true
      : o.orientation === "landscape" ? false
      : root.matchMedia(o.verticalQuery).matches;
    const u0 = rotated ? 0.3 : 0;
    const xStart = X_LEAD + u0 * X_SPAN;
    const xEnd = X_LEAD + X_SPAN;
    const usedLength = xEnd - xStart;
    let scale, originX, originY, pixelLength;
    if (rotated) {
      const inset = height * 0.03;
      const avail = height - inset * 2;
      scale = min(avail / usedLength, width / (VH * 0.9));
      originX = width / 2;
      originY = inset + (avail - usedLength * scale) / 2 - xStart * scale;
      pixelLength = usedLength * scale;
    } else {
      scale = width / VW;
      originX = 0;
      const cssHeight = rect.height;
      const lift = min(1, max(0, (cssHeight - 600) / 200));
      const anchor = 0.26 + lift * 0.14;
      originY = height * anchor - (VH / 2) * scale;
      pixelLength = usedLength * scale;
    }
    const count = floor(min(o.maxPoints, max(o.minPoints, pixelLength * 16)));
    return { dpr, width, height, dot, rotated, u0, scale, originX, originY, count };
  }

  function drawField(ctx, G, st, opaque) {
    const { width, height, dot, rotated, u0, scale, originX, originY, count } = G;
    const t = st.t;
    const energy = st.energy;
    const pr = min(width, height) * 0.24;
    const pr2 = pr * pr;
    const plucked = st.pStrength > 0.01;

    if (opaque) {
      ctx.fillStyle = VOID;
      ctx.fillRect(0, 0, width, height);
    } else {
      ctx.clearRect(0, 0, width, height);
    }
    ctx.globalCompositeOperation = "lighter";

    let i = 1;
    for (let b = 0; b < BANDS.length; b++) {
      const stop = floor(BANDS[b].end * count);
      ctx.fillStyle = BANDS[b].fill;
      for (; i <= stop; i++) {
        const u = u0 + (i / count) * (1 - u0);
        const s = u * 46;
        const g = smoothstep((u - 0.04) / 0.92);
        const k = (3 + cos(s - t)) * cos(i / 31);
        const e = s / 7 - 12;
        const d = (k * k + e * e) / 26;
        const c = d - t / 3;
        const q =
          2.5 * sin(k * 2) +
          0.35 / k +
          (s / 20) * k * (8 + 2.5 * sin(e * 41 - d * 3.5 + t));

        const vx = X_LEAD + u * X_SPAN + q * 0.4 * g;
        const vy =
          VH / 2 +
          (q * sin(c) * 0.85 + 20 * sin(t / 4 + e)) *
            (0.1 + g * (0.85 + energy * 0.4));

        let x = rotated ? originX + (VH / 2 - vy) * scale : originX + vx * scale;
        let y = rotated ? originY + vx * scale : originY + vy * scale;

        if (plucked) {
          const dx = x - st.px;
          const dy = y - st.py;
          const d2 = dx * dx + dy * dy;
          if (d2 < pr2) {
            const f = 1 - d2 / pr2;
            const wob =
              sin(t * 9 + u * 90) *
              f * f * st.pStrength * pr * 0.2 * (1 - g * 0.45);
            if (rotated) x += wob;
            else y += wob;
          }
        }

        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        ctx.fillRect(x | 0, y | 0, dot, dot);
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function fieldState(t) {
    return { t, energy: 0, energyTarget: 0, px: 0, py: 0, pTX: 0, pTY: 0, pStrength: 0, pTarget: 0, rest: 1 };
  }

  function drawSignalFrame(canvas, options) {
    const o = Object.assign({}, FIELD_DEFAULTS, { t: FIELD_DEFAULTS.tStatic, energy: 0 }, options || {});
    decorate(canvas);
    const ctx = canvas.getContext("2d", { alpha: !o.opaque });
    if (!ctx) throw new Error("signal.js: no 2d context");
    const st = fieldState(o.t);
    st.energy = o.energy;
    drawField(ctx, fieldGeometry(canvas, o), st, o.opaque);
  }

  // One loop driver shared by both canvases: settle, offscreen, background tab,
  // reduced motion, fps cap. `step(dt, now)` advances state and returns true while
  // something is still changing; `draw()` paints.
  function makeLoop(canvas, o, hooks) {
    let raf = 0;
    let last = 0;
    let lastDraw = 0;
    let lastInput = 0;
    let paused = false;
    let visible = typeof document === "undefined" || document.visibilityState !== "hidden";
    let onscreen = true;
    let reduced = false;
    let rest = 1;

    const running = () => !reduced && !paused && visible && onscreen;

    const frame = (now) => {
      raf = 0;
      if (!running()) return;
      if (o.maxFps > 0 && lastDraw && now - lastDraw < 1000 / o.maxFps - 2.5) {
        raf = requestAnimationFrame(frame);
        return;
      }
      const dt = last ? min((now - last) / 1000, 0.05) : 0;
      last = now;
      lastDraw = now;
      const idle = !hooks.exemptFromIdle() && o.idleStopMs > 0 && now - lastInput > o.idleStopMs;
      rest += ((idle ? 0 : 1) - rest) * min(1, dt * 4);
      const changing = hooks.step(dt * rest, dt, now);
      hooks.draw();
      const settled = idle && rest < 0.01 && !changing;
      if (!settled) raf = requestAnimationFrame(frame);
    };

    const wake = () => {
      lastInput = root.performance.now();
      if (!raf && running()) {
        last = 0;
        raf = requestAnimationFrame(frame);
      }
    };

    const stop = () => {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    };

    const onVisibility = () => {
      visible = document.visibilityState !== "hidden";
      if (visible) wake();
      else stop();
    };

    let io = null;
    if (o.pauseOffscreen && typeof IntersectionObserver !== "undefined") {
      io = new IntersectionObserver((entries) => {
        const entry = entries[entries.length - 1];
        onscreen = entry.isIntersecting;
        if (onscreen) wake();
        else stop();
      }, { threshold: 0 });
      io.observe(canvas);
    }
    document.addEventListener("visibilitychange", onVisibility);

    return {
      wake,
      stop,
      redrawIfIdle() {
        if (!raf) hooks.draw();
      },
      setReduced(r) {
        reduced = r;
        if (r) stop();
      },
      pause() {
        paused = true;
        stop();
      },
      resume() {
        paused = false;
        wake();
      },
      destroy() {
        stop();
        if (io) io.disconnect();
        document.removeEventListener("visibilitychange", onVisibility);
      },
    };
  }

  function on(el, type, fn, list) {
    if (!el) return;
    el.addEventListener(type, fn);
    list.push(() => el.removeEventListener(type, fn));
  }

  function mountSignalField(canvas, options) {
    const o = Object.assign({}, FIELD_DEFAULTS, options || {});
    if (o.interactionEl === undefined) o.interactionEl = canvas.parentElement;
    if (o.surgeEl === undefined) {
      o.surgeEl = o.interactionEl ? o.interactionEl.querySelector(".signal-title") : null;
    }
    decorate(canvas);
    const ctx = canvas.getContext("2d", { alpha: !o.opaque });
    if (!ctx) throw new Error("signal.js: no 2d context");

    const mq = root.matchMedia("(prefers-reduced-motion: reduce)");
    let st = fieldState(o.t0);
    let G = fieldGeometry(canvas, o);
    let detach = [];
    let releaseTimer = 0;
    let surgeTimer = 0;

    const loop = makeLoop(canvas, o, {
      exemptFromIdle: () => false,
      step(dtRest, dt) {

        st.px += (st.pTX - st.px) * min(1, dt * 10);
        st.py += (st.pTY - st.py) * min(1, dt * 10);
        st.energy += (st.energyTarget - st.energy) * min(1, dt * 4);

          abs(st.pTarget - st.pStrength) > 0.01 ||
          abs(st.energyTarget - st.energy) > 0.01 ||
          abs(st.pTX - st.px) > 0.5 ||
          abs(st.pTY - st.py) > 0.5

      const r = canvas.getBoundingClientRect();

    };

      releaseTimer = setTimeout(() => {
        st.pTarget = 0;
        loop.wake();
      }, 400);
    };
    const surge = (onOff) => {
      st.energyTarget = onOff ? 1 : 0;
      loop.wake();
    };

      const zone = o.interactionEl;
      on(zone, "pointermove", (ev) => {

        st.pTY = p[1];

        if (st.pStrength < 0.02) {
          st.px = st.pTX;
          st.py = st.pTY;

        loop.wake();
      }, detach);
      on(zone, "pointerdown", (ev) => {
        const p = toDevice(ev);
        st.pTX = st.px = p[0];
        st.pTY = st.py = p[1];

      on(zone, "pointerleave", (ev) => {

          loop.wake();

      on(title, "pointerleave", (ev) => {
        if (ev.pointerType !== "touch") surge(false);

      if (mq.matches) {

        loop.setReduced(true);

        drawField(ctx, G, st, o.opaque);

        loop.setReduced(false);
        st = fieldState(o.t0);
        G = fieldGeometry(canvas, o);

        loop.wake();
      }

      detach.forEach((off) => off());
      detach = [];
      clearTimeout(releaseTimer);
      clearTimeout(surgeTimer);

    };

      G = fieldGeometry(canvas, o);
      loop.redrawIfIdle();
    });

      teardown();
      setup();
    };
    mq.addEventListener("change", onMq);
    setup();

    return {
      destroy() {
        teardown();
        ro.disconnect();
        mq.removeEventListener("change", onMq);
        loop.destroy();
      },
      pause: loop.pause,
      resume: loop.resume,

  // ----------------------------------------------------------- the status trace

  const TRACE_VH = 100;
  const TRACE_DEFAULTS = {
    interactionEl: undefined, // default canvas.parentElement (the block, not the 56px canvas)
    mode: "ambient", // "ambient" (live site) | "events" (only burst() calls) | "busy" (loading)
    t0: 0,
    tStatic: 3.1,
    maxSamples: 2200,
    maxBursts: 15,
    dprCap: 2,
    maxFps: 60,
    idleStopMs: 5000,
    pauseOffscreen: true,
  };

  function seedBursts() {
    // Off-screen seeds so the line is never caught empty on first paint.
    return [
      { u: 0.2, speed: 0.055, life: 1, power: 0.55 },
      { u: -0.35, speed: 0.045, life: 1, power: 0.42 },
    ];
  }

  function traceGeometry(canvas, o) {
    const dpr = dprOf(o.dprCap);
    const rect = canvas.getBoundingClientRect();
    const width = max(1, floor(rect.width * dpr));
    const height = max(1, floor(rect.height * dpr));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    const dot = max(1, round(dpr));
    const count = min(o.maxSamples, max(320, floor(width / dot)));

  function drawTrace(ctx, G, s) {
    const { width, height, dot, count } = G;
    const t = s.t;

    const midY = height / 2;
    const scaleY = height / TRACE_VH;

      const u = i / (count - 1);
      const x = u * (width - dot);

        const d = u - b.u;
        const shape = d < 0 ? gauss(d, 0.009) : gauss(d, 0.042);

      }
      if (s.strength > 0.01 && s.px >= 0) {
        const d = (x - s.px) / width;
        const near = gauss(d, 0.07);

      }
      const wobble = sin(u * 210 + t * 5) * 0.5;
      const y = midY + (amp * wobble + sin(u * 61 - t * 2) * amp * 0.5) * scaleY;

      ctx.fillStyle = `rgba(${150 + heat * 96}, ${178 + heat * 72}, ${212 + heat * 43}, ${0.2 + heat * 0.5})`;

    return { t, bursts: mode === "events" ? [] : seedBursts(), px: -1, pTargetX: -1, strength: 0, targetStrength: 0 };
  }

    const o = Object.assign({}, TRACE_DEFAULTS, { t: TRACE_DEFAULTS.tStatic }, options || {});

    // bursts arrive irregularly (1.1 to 2.9 s) instead of near a 1.3 s metronome.
    const nextInterval = () => (o.mode === "busy" ? 0.4 + random() * 0.4 : 1.1 + random() * 1.8);
    let nextSpawn = nextInterval();
    let releaseTimer = 0;

    const spawn = (u, power) => {
      if (s.bursts.length >= o.maxBursts) return;
      s.bursts.push({ u, speed: 0.035 + random() * 0.05, life: 1, power });
    };

    const loop = makeLoop(canvas, o, {
      exemptFromIdle: () => o.mode === "busy" || (o.mode === "events" && s.bursts.length > 0),
      step(dtRest, dt) {
        s.t += dtRest;
        if (o.mode !== "events") {
          sinceSpawn += dtRest;
          if (sinceSpawn > nextSpawn) {
            sinceSpawn = 0;
            nextSpawn = nextInterval();
            spawn(-0.08, 0.3 + random() * 0.4);
          }

        for (const b of s.bursts) {
          b.u += b.speed * dtRest;
          if (b.u > 0.55) b.life -= dtRest * 0.55;
        }
        for (let i = s.bursts.length - 1; i >= 0; i--) {

        }
        s.strength += (s.targetStrength - s.strength) * min(1, dt * 6);
        s.px += (s.pTargetX - s.px) * min(1, dt * 12);
        return abs(s.targetStrength - s.strength) > 0.01 || abs(s.pTargetX - s.px) > 0.5;
      },
      draw() {
        drawTrace(ctx, G, s);
      },
    });

    const xOf = (ev) => {
      const rect = canvas.getBoundingClientRect();
      return { dev: (ev.clientX - rect.left) * G.dpr, frac: (ev.clientX - rect.left) / max(1, rect.width) };
    };

    const attach = () => {
      const zone = o.interactionEl;
      on(zone, "pointermove", (ev) => {
        const p = xOf(ev);
        if (s.strength < 0.02) s.px = p.dev;
        s.pTargetX = p.dev;
        s.targetStrength = 1;
        loop.wake();

        if (ev.pointerType === "mouse") return;

        loop.wake();
      }, detach);
      const release = () => {
        clearTimeout(releaseTimer);
        releaseTimer = setTimeout(() => {
          s.targetStrength = 0;
          loop.wake();
        }, 400);
      };

        if (ev.pointerType !== "mouse") release();
      }, detach);
      on(zone, "pointercancel", release, detach);
      on(zone, "pointerleave", (ev) => {
        if (ev.pointerType === "mouse") {
          s.targetStrength = 0;
          loop.wake();
        } else {
          release();
        }
      }, detach);
    };

    const setup = () => {
      if (mq.matches) {
        loop.setReduced(true);
        s = traceState(o.tStatic, o.mode);
        G = traceGeometry(canvas, o);
        drawTrace(ctx, G, s);
      } else {
        loop.setReduced(false);
        s = traceState(o.t0, o.mode);
        G = traceGeometry(canvas, o);
        attach();
        loop.wake();
      }
    };
    const teardown = () => {
      detach.forEach((off) => off());
      detach = [];
      clearTimeout(releaseTimer);
      loop.stop();
    };

      G = traceGeometry(canvas, o);
      loop.redrawIfIdle();
    });
    ro.observe(canvas);
    const onMq = () => {
      teardown();
      setup();
    };
    mq.addEventListener("change", onMq);
    setup();

    return {
      destroy() {
        teardown();
        ro.disconnect();
        mq.removeEventListener("change", onMq);
        loop.destroy();
      },
      pause: loop.pause,
      resume: loop.resume,
      // One real event, one burst. Never fake events on a dashboard.
      burst(power, u) {
        spawn(u === undefined ? 0.02 : u, power === undefined ? 0.5 : power);
        if (mq.matches) drawTrace(ctx, G, s);
        else loop.wake();
      },
    };
  }

  // ------------------------------------------------------ data in the material

  const SERIES_DEFAULTS = {
    color: "#a8b4c8", // paper-soft
    lastColor: "#cfe2ff", // glow, the newest sample only
    outColor: "#f0b8b0", // fail, samples past the threshold
    threshold: null,
    thresholdAbove: true, // true: values > threshold are out; false: values < threshold
    min: null,
    max: null,
    dot: 2, // CSS px per sample
    join: true, // 1 CSS px dots every 2 CSS px between samples
    fade: false, // older samples dimmer (.35 to 1)
    pad: 2, // CSS px
    dprCap: 2,
    label: "", // aria-label; generated from the data when empty
    unit: "",
  };

  function drawDotSeries(canvas, values, options) {
    const o = Object.assign({}, SERIES_DEFAULTS, options || {});

    const dpr = dprOf(o.dprCap);
    const rect = canvas.getBoundingClientRect();
    const width = max(1, floor(rect.width * dpr));
    const height = max(1, floor(rect.height * dpr));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    ctx.clearRect(0, 0, width, height);

    const pts = [];
    (values || []).forEach((v, i) => {
      if (typeof v === "number" && isFinite(v)) pts.push([i, v]);

    }

    const lo = o.min !== null ? o.min : Math.min.apply(null, vals);
    const hi = o.max !== null ? o.max : Math.max.apply(null, vals);
    const span = hi - lo || 1;
    const dotPx = max(1, round(o.dot * dpr));
    const one = max(1, round(dpr));
    const pad = o.pad * dpr;
    const xOf = (i) => pad + (n > 1 ? i / (n - 1) : 0.5) * (width - 2 * pad - dotPx);
    const yOf = (v) => pad + (1 - (v - lo) / span) * (height - 2 * pad - dotPx);
    const isOut = (v) =>
      o.threshold !== null && (o.thresholdAbove ? v > o.threshold : v < o.threshold);

    if (o.join) {
      ctx.fillStyle = o.color;
      ctx.globalAlpha = 0.55;
      const step = 2 * dpr;
      for (let k = 1; k < pts.length; k++) {
        const x0 = xOf(pts[k - 1][0]) + dotPx / 2;
        const y0 = yOf(pts[k - 1][1]) + dotPx / 2;
        const x1 = xOf(pts[k][0]) + dotPx / 2;
        const y1 = yOf(pts[k][1]) + dotPx / 2;
        const len = Math.hypot(x1 - x0, y1 - y0);
        const m = floor(len / step);
        for (let j = 1; j < m; j++) {
          const f = j / m;
          ctx.fillRect((x0 + (x1 - x0) * f) | 0, (y0 + (y1 - y0) * f) | 0, one, one);
        }
      }
      ctx.globalAlpha = 1;
    }
    pts.forEach((p, k) => {
      const last = k === pts.length - 1;
      ctx.globalAlpha = o.fade && !last ? 0.35 + 0.65 * (k / max(1, pts.length - 1)) : 1;
      ctx.fillStyle = isOut(p[1]) ? o.outColor : last ? o.lastColor : o.color;
      const size = last ? max(dotPx, round(3 * dpr)) : dotPx;
      ctx.fillRect(xOf(p[0]) | 0, yOf(p[1]) | 0, size, size);
    });

    const latest = vals[vals.length - 1];
    canvas.setAttribute(
      "aria-label",
      o.label || `${pts.length} samples, latest ${latest}${unit}, range ${lo}${unit} to ${hi}${unit}`
    );
  }

  root.SomachSignal = {
    mountSignalField,
    mountStatusTrace,
    drawSignalFrame,
    drawTraceFrame,
    drawDotSeries,
    VERSION: "2026-10-02",
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>
(function(){

/* ---- tiny DOM helpers ---- */

/* ============ beats: each {id,name,dur,build(el)->{seek(ms)}} ============ */
const BEATS=[];

/* 01 title: the strand, the name, the plain sentence */
BEATS.push({id:'title',name:'Title',dur:6000,build(b){

  const m=tx(b,'mn','a16z SpeedHacks, 2026-10-11. Theme: give people their time back. Carl Kho.',160,900);

}});

BEATS.push({id:'story',name:'The story',dur:13000,build(b){

const STATIC=PRINT||PHONE;
const live=[];let starts=[],total=0;
BEATS.forEach((bt,i)=>{const b=el('section','beat');b.id='b-'+bt.id;host.appendChild(b);const api=bt.build(b);
  b.appendChild(el('span','wordmark wm','take a number<i>.</i>'));b.appendChild(el('span','pg',pad(i+1)+' / '+pad(BEATS.length)));
  live.push({bt,b,api});starts.push(total);total+=bt.dur});
window.DURATION_MS=total;window.BEAT_STARTS=starts;
let cur=-1;
function notesHtml(i){return (NOTES[live[i].bt.id]||[]).map(p=>'<p>'+p+'</p>').join('')}
function showBeat(i){if(i===cur)return;if(cur>=0){live[cur].b.classList.remove('cur');if(live[cur].api.leave)live[cur].api.leave()}cur=i;live[i].b.classList.add('cur');if(live[i].api.enter)live[i].api.enter();
  $('#hud').textContent=live[i].bt.name+' · N notes · arrows · A autoplay';
  $('#drawer').innerHTML='<div class="k">'+pad(i+1)+' / '+pad(live.length)+' · '+live[i].bt.name+'</div>'+notesHtml(i)}
/* global seek: ms on the whole timeline */
function seekGlobal(ms){ms=clamp(ms,0,total-1);let i=0;while(i<live.length-1&&ms>=starts[i+1])i++;showBeat(i);live[i].api.seek(ms-starts[i]);$('#bar').style.width=(ms/total*1920).toFixed(1)+'px'}
window.seek=seekGlobal;
function fit(){stage.style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080))}

function stacked(cls){document.body.classList.add(cls);document.documentElement.classList.add(cls);
  const draw=()=>live.forEach(o=>{if(o.api.enter)o.api.enter();o.api.seek(o.bt.dur-1)});
  draw();return (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(draw)}
if(PRINT){stacked('print').then(()=>{window.__ready=true});return}
if(PHONE){const setK=()=>document.documentElement.style.setProperty('--k',innerWidth/1920);setK();addEventListener('resize',setK);
  stacked('phone');live.forEach((o,i)=>{const d=el('div','pnotes','<div class="k">'+pad(i+1)+' / '+pad(live.length)+' · '+o.bt.name+'</div>'+notesHtml(i));o.b.insertAdjacentElement('afterend',d)});return}
addEventListener('resize',fit);fit();
if(RENDER){seekGlobal(+(Q.get('t')||0));(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{window.__ready=true});return}

/* live: a beat plays from 0 when entered; Right = finish the beat, then next; Left = previous; Space = pause; A = autoplay; N = notes */
let beat=0,t0=performance.now(),local=0,playing=true,auto=AUTOPLAY;
function playBeat(i,from){beat=clamp(i,0,live.length-1);local=from||0;t0=performance.now()-local;playing=true;try{history.replaceState(null,'','#'+(beat+1))}catch(e){}}
function tick(){const now=performance.now();if(playing)local=now-t0;const d=live[beat].bt.dur;
  if(local>=d){if(auto&&beat<live.length-1){playBeat(beat+1,0)}else{local=d-1;playing=false}}
  seekGlobal(starts[beat]+local);requestAnimationFrame(tick)}
function finishOrNext(){if(local<live[beat].bt.dur-1){local=live[beat].bt.dur-1;t0=performance.now()-local;playing=false}else if(beat<live.length-1)playBeat(beat+1,0)}
let digits='',dt=0;
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();finishOrNext()}
  else if(k===' '){e.preventDefault();if(local>=live[beat].bt.dur-1){if(beat<live.length-1)playBeat(beat+1,0)}else if(playing){playing=false}else{playing=true;t0=performance.now()-local}}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();playBeat(local>600?beat:beat-1,0)}
  else if(k==='r'||k==='R'){playBeat(beat,0)}
  else if(k==='a'||k==='A'){auto=!auto;playing=true;t0=performance.now()-local}
  else if(k==='n'||k==='N'){document.body.classList.toggle('shownotes')}
  else if(k==='Home'){playBeat(0,0)}
  else if(k==='End'){playBeat(live.length-1,0)}
  else if(/^[0-9]$/.test(k)){digits+=k;clearTimeout(dt);dt=setTimeout(()=>{const n=+digits||10;digits='';if(n>=1&&n<=live.length)playBeat(n-1,0)},500)}});
addEventListener('click',e=>{if(e.target.closest('#drawer'))return;finishOrNext()});
let txs=0;addEventListener('touchstart',e=>{txs=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-txs;if(dx<-60)playBeat(beat+1,0);else if(dx>60)playBeat(beat-1,0)});
playBeat(clamp((parseInt((location.hash||'#1').slice(1),10)||1)-1,0,live.length-1),0);tick();
})();
</script>
<script data-somach-fontcheck>
// Silence is the bug: a face that fails to load paints a red bar instead of quietly falling back.
document.fonts.ready.then(async () => {
  const want = ['400 16px "Geist Pixel Circle"', '400 16px "Geist Pixel Square"', '400 16px "Inter"', '400 16px "JetBrains Mono"'];
  const ok = await Promise.all(want.map((f) => document.fonts.load(f).then((r) => r.length > 0, () => false)));
  const miss = want.filter((_, i) => !ok[i]).map((f) => f.split('"')[1]);
  if (miss.length) { console.error("fonts missing:", miss); document.documentElement.dataset.fontsMissing = miss.join(", "); }
});
</script>
</body>
